
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FertiSense - Soil Analysis</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f5ef;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 30px auto;
            padding: 30px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 10px #cccccc;
        }

        h1 {
            text-align: center;
            color: #287a3d;
        }

        .description {
            text-align: center;
            color: #555555;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #bbbbbb;
            border-radius: 5px;
            box-sizing: border-box;
            background: white;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 25px;
            background: #287a3d;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        #soilMessage {
            margin-top: 15px;
            text-align: center;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>FertiSense Soil Analysis</h1>

        <p class="description">
            Enter your soil test results below.
        </p>

        <form id="soilForm">

            <label for="crop">Select Crop</label>
            <select id="crop" required>
                <option value="">Select a crop</option>
                <option value="Tomato">Tomato</option>
                <option value="Rice">Rice</option>
                <option value="Wheat">Wheat</option>
                <option value="Cotton">Cotton</option>
                <option value="Maize">Maize</option>
            </select>

            <label for="nitrogen">Nitrogen (N)</label>
            <input type="number" id="nitrogen"
                   min="0" step="any" required>

            <label for="phosphorus">Phosphorus (P)</label>
            <input type="number" id="phosphorus"
                   min="0" step="any" required>

            <label for="potassium">Potassium (K)</label>
            <input type="number" id="potassium"
                   min="0" step="any" required>

            <label for="ph">Soil pH</label>
            <input type="number" id="ph"
                   min="0" max="14" step="any" required>

            <button type="submit">Save Soil Test</button>

            <p id="soilMessage"></p>

        </form>

        <a class="back-link" href="dashboard.html">
            Back to Dashboard
        </a>

    </div>

    <script src="js/soil-analysis.js"></script>

</body>
</html>
